# A cronjob for updating the spreadsheet-pulled dataset for lipu Kemeka

name: Cronjob for lipu Kemeka
on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "data/requirements.txt"

      - name: "Install Python dependencies"
        run: "pip install -r data/requirements.txt"

      - name: Git configuration
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
        run: |
          git config --global user.email "AcipenserSturio@users.noreply.github.com"
          git config --global user.name "AcipenserSturio"

      - name: Fetch data
        run: python data/fetch-csv.py

      - name: Verify site build
        uses: withastro/action@v6

      - name: Push data
        run: |
          git add data/*.csv
          git diff-index --quiet --cached HEAD || git commit -m "Update data for $(date --iso-8601)"
          git push "https://$(GITHUB_TOKEN)@github.com/pona-la/kemeka.pona.la.git"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
